name: Build RavenEngineAi IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.0.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive (unsigned)
        run: |
          xcodebuild archive \
            -project RavenEngineAi.xcodeproj \
            -scheme RavenEngineAi \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath build/RavenEngineAi.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Export unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -R build/RavenEngineAi.xcarchive/Products/Applications/RavenEngineAi.app build/Payload/
          cd build
          zip -r RavenEngineAi.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: RavenEngineAi-unsigned-ipa
          path: build/RavenEngineAi.ipa
          retention-days: 30
