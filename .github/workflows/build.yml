name: Build RavenEngineAi

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            lld \
            make \
            git \
            perl \
            python3 \
            unzip \
            zip \
            libplist-utils \
            fakeroot \
            libtinfo6

      - name: Install Theos + iOS toolchain
        run: |
          git clone --depth 1 --recursive https://github.com/theos/theos.git "$THEOS"

          mkdir -p "$THEOS/toolchain"
          curl -fsSL https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz \
            | tar -xJf - -C "$THEOS/toolchain"

          test -x "$THEOS/toolchain/linux/iphone/bin/clang"
          test -x "$THEOS/toolchain/linux/iphone/bin/clang++"

          if [ -d "$THEOS/sdks/.git" ] || [ -f "$THEOS/sdks/.git" ]; then
            git -C "$THEOS/sdks" fetch --depth 1 origin
          else
            rm -rf "$THEOS/sdks"
            git clone --depth 1 https://github.com/theos/sdks.git "$THEOS/sdks"
          fi

      - name: Prepare CoreML model
        run: |
          test -f RavenModelPackage_Upload.zip
          rm -rf Resources/RavenModelPackage Resources/RavenModel.mlpackage
          unzip -oq RavenModelPackage_Upload.zip -d .
          mv Resources/RavenModelPackage Resources/RavenModel.mlpackage
          test -f Resources/RavenModel.mlpackage/Manifest.json
          test -f Resources/RavenModel.mlpackage/Data/com.apple.CoreML/model.mlmodel
          test -f Resources/RavenModel.mlpackage/Data/com.apple.CoreML/weights/weight.bin

      - name: Build dylib
        run: |
          make clean
          make FINALPACKAGE=1

      - name: Prepare non-JB artifact
        run: |
          rm -rf dist
          mkdir -p dist/Resources
          test -f .theos/obj/RavenEngineAi.dylib
          cp .theos/obj/RavenEngineAi.dylib dist/RavenEngineAi.dylib
          cp -R Resources/RavenModel.mlpackage dist/Resources/RavenModel.mlpackage
          cp control dist/control
          printf '%s\n'             'RavenEngineAi non-JB build'             'Inject RavenEngineAi.dylib into the target IPA.'             'Keep Resources/RavenModel.mlpackage with the app resources so the runtime can find the model.'             > dist/README.txt
          echo "=== artifact contents ==="
          find dist -type f -print

      - name: Upload RavenEngineAi artifact
        uses: actions/upload-artifact@v4
        with:
          name: RavenEngineAi-nonJB
          path: dist/
          if-no-files-found: error
          retention-days: 14
