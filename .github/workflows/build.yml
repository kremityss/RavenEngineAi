name: Build RavenEngineAi

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            lld \
            make \
            git \
            perl \
            python3 \
            unzip \
            zip \
            libplist-utils \
            fakeroot

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$THEOS"

      - name: Install iOS SDK
        run: |
          git clone --depth 1 https://github.com/theos/sdks.git "$THEOS/sdks"

      - name: Prepare CoreML model
        run: |
          test -f RavenModelPackage_Upload.zip
          rm -rf Resources/RavenModelPackage Resources/RavenModel.mlpackage
          unzip -oq RavenModelPackage_Upload.zip -d .
          mv Resources/RavenModelPackage Resources/RavenModel.mlpackage
          test -f Resources/RavenModel.mlpackage/Manifest.json
          test -f Resources/RavenModel.mlpackage/Data/com.apple.CoreML/model.mlmodel
          test -f Resources/RavenModel.mlpackage/Data/com.apple.CoreML/weights/weight.bin

      - name: Build
        run: |
          make clean
          make package FINALPACKAGE=1

      - name: Show outputs
        if: always()
        run: |
          echo "=== packages ==="
          find packages -maxdepth 2 -type f -print 2>/dev/null || true
          echo "=== dylibs ==="
          find .theos -type f \( -name "*.dylib" -o -name "*.deb" \) -print 2>/dev/null || true

      - name: Upload package artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RavenEngineAi-package
          path: |
            packages/*.deb
            .theos/obj/**/*.dylib
          if-no-files-found: error
          retention-days: 14
